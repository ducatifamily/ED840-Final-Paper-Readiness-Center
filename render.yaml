services:
  - type: web
    name: ed840-final-paper-readiness-center
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'self' https://*.instructure.com https://*.canvaslms.com https://*.brightspace.com https://*.d2l.com"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
